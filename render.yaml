services:
  - type: web
    name: kindred-code
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/matches
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_INSTALLATION_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
